<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep matte luxury charcoal background matching user's reference image -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="65%" stop-color="#111114"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>

    <!-- Crisp clean silver-white metallic gradient for the Persona profile emblem -->
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Squircle rounded background for desktop shortcut icon / app avatar -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" stroke="#27272a" stroke-width="4"/>

  <!-- Persona Stylized Profile Emblem: optically centered -->
  <g transform="translate(68, 62) scale(3.68)" filter="url(#subtleShadow)">
    <!-- Outer head arch with forehead, nose slope, tip, and indent -->
    <path
      d="M 23 58 C 23 34 38 20 60 20 C 72 20 81 27 86 38 L 94 56 L 81 56"
      stroke="url(#emblemGrad)"
      stroke-width="7.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Lower jaw and chin contour -->
    <path
      d="M 81 56 L 81 68 C 81 83 71 91 58 91 L 44 91"
      stroke="url(#emblemGrad)"
      stroke-width="7.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Left vertical stem with top hook (forms the spine of P) -->
    <path
      d="M 37 94 L 37 46 C 37 35 44 32 52 32 C 60 32 64 36 64 44 L 64 56"
      stroke="url(#emblemGrad)"
      stroke-width="7.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Eye dot -->
    <circle cx="71" cy="46" r="4.2" fill="#ffffff" />
  </g>
</svg>
