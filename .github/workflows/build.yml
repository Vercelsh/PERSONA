name: Build Windows App (.exe)

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Generate Official Tauri Windows Icons
        run: npx @tauri-apps/cli icon src-tauri/icons/icon.png --output src-tauri/icons

      - name: Build Desktop Executable via Tauri CLI
        run: npx @tauri-apps/cli build --ignore-version-mismatches

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Persona-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
