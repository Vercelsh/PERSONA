name: Build Windows App (.exe)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version = $config.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Application version is missing from src-tauri/tauri.conf.json"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Release version: $version"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps

      - name: Check TypeScript
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Generate Official Tauri Windows Icons
        run: npx @tauri-apps/cli icon src-tauri/icons/icon.png --output src-tauri/icons

      - name: Build Desktop Installer
        run: npx @tauri-apps/cli build --ignore-version-mismatches

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Persona v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: src-tauri/target/release/bundle/nsis/*.exe
          body: |
            ## Persona v${{ steps.version.outputs.version }}

            Установщик Persona для Windows.

            ### Установка
            1. Скачайте файл `.exe` из раздела Assets.
            2. Запустите установщик и следуйте инструкциям.
            3. Запустите Persona из меню «Пуск».

            Учебные данные хранятся локально на устройстве и не синхронизируются автоматически.
